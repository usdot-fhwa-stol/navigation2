name: Docker Hub build

on:
  workflow_dispatch:
  push:
    branches:
      - "develop"
      - "master"
      - "release/*"
      - "add_gha_workflows"
    tags:
      - "carma-system-*"
jobs:
  dockerhub:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}